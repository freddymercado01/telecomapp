<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barrios | TelecomApp</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script defer th:src="@{/js/app-ui.js}"></script>
</head>
<body>
<div class="layout">
    <aside th:replace="~{fragments/sidebar :: appSidebar('barrios')}"></aside>

    <main class="content">
        <header class="app-topbar">
            <div class="topbar-left">
                <img th:src="@{/media/logo.png}" alt="Logo TelecomApp">
                <div class="topbar-msg">
                    <h1>Gestion telecom</h1>
                    <p>Administra clientes, planes, contratos y facturacion.</p>
                </div>
            </div>
            <span class="topbar-pill">Panel operativo</span>
        </header>

        <section class="page stack-lg">
            <header class="page-header">
                <div class="brand">
                    <h1>Barrios</h1>
                    <p>Gestion de cobertura por zona para el flujo comercial.</p>
                </div>
                <div class="actions">
                    <a class="btn btn-primary" th:href="@{/barrios/nuevo}">Nuevo barrio</a>
                </div>
            </header>

            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

            <section class="card table-wrap">
                <div class="table-toolbar">
                    <div class="table-meta" th:text="${'Total barrios: ' + #lists.size(barrios)}"></div>
                    <div class="table-search">
                        <input type="text" placeholder="Buscar por nombre, cobertura o descripcion..." data-table-search="barrios-table">
                    </div>
                </div>
                <table id="barrios-table" class="app-table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Barrio</th>
                        <th>Cobertura</th>
                        <th>Descripcion</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(barrios)}" class="empty-row">
                        <td class="empty-row" colspan="5">No hay barrios registrados aun.</td>
                    </tr>
                    <tr th:each="b : ${barrios}" data-filter-row="true">
                        <td th:text="${b.idBarrio}"></td>
                        <td th:text="${b.nombre}"></td>
                        <td>
                            <span class="status-chip"
                                  th:classappend="${b.cobertura} ? ' status-active' : ' status-inactive'"
                                  th:text="${b.cobertura} ? 'Con cobertura' : 'Sin cobertura'"></span>
                        </td>
                        <td th:text="${b.descripcion}"></td>
                        <td>
                            <div class="actions">
                                <a class="btn btn-link" th:href="@{'/barrios/' + ${b.idBarrio} + '/editar'}">Editar</a>
                                <form th:action="@{'/barrios/' + ${b.idBarrio} + '/eliminar'}" method="post" data-confirm="¿Eliminar este barrio? Esta acción no se puede deshacer.">
                                    <button type="submit" class="btn-danger">Eliminar</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr class="no-results-row">
                        <td class="empty-row" colspan="5">No hay resultados para la búsqueda actual.</td>
                    </tr>
                    </tbody>
                </table>
            </section>
        </section>
    </main>
</div>
</body>
</html>
