<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<aside class="sidebar" th:fragment="appSidebar(currentMenu)">
    <div class="sidebar-brand">
        <img th:src="@{/media/logo.png}" alt="Logo TelecomApp">
        <div>
            <h2>TelecomApp</h2>
            <p>Portal de gestion comercial</p>
        </div>
    </div>

    <nav class="side-nav">
        <a th:href="@{/dashboard}" th:classappend="${currentMenu == 'dashboard'} ? 'active' : ''">Dashboard</a>
        <a th:href="@{/clientes}" th:classappend="${currentMenu == 'clientes'} ? 'active' : ''">Clientes</a>
        <a th:href="@{/barrios}" th:classappend="${currentMenu == 'barrios'} ? 'active' : ''">Barrios</a>
        <a th:href="@{/planes}" th:classappend="${currentMenu == 'planes'} ? 'active' : ''">Planes</a>
        <a th:href="@{/contratos}" th:classappend="${currentMenu == 'contratos'} ? 'active' : ''">Contratos</a>
        <a th:href="@{/facturas}" th:classappend="${currentMenu == 'facturas'} ? 'active' : ''">Facturas</a>
    </nav>

    <form th:action="@{/logout}" method="post" class="sidebar-logout">
        <button type="submit">Salir</button>
    </form>
</aside>
</body>
</html>
