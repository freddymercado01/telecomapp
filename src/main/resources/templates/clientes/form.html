<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cliente | TelecomApp</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="layout">
    <aside th:replace="~{fragments/sidebar :: appSidebar('clientes')}"></aside>

    <main class="content">
        <header class="app-topbar">
            <div class="topbar-left">
                <img th:src="@{/media/logo.png}" alt="Logo TelecomApp">
                <div class="topbar-msg">
                    <h1>Gestion telecom</h1>
                    <p>Administra clientes, planes, contratos y facturacion.</p>
                </div>
            </div>
            <span class="topbar-pill">Panel operativo</span>
        </header>

        <section class="page stack-lg">
            <header class="page-header">
                <div class="brand">
                    <h1 th:text="${cliente.idCliente} == null ? 'Nuevo cliente' : 'Editar cliente'"></h1>
                    <p>Informacion de contacto y ubicacion del cliente.</p>
                </div>
                <a class="btn btn-link" th:href="@{/clientes}">Volver</a>
            </header>

            <section class="card card-sm">
                <form th:action="@{/clientes}" method="post" th:object="${cliente}" class="form-stack">
                    <input type="hidden" th:field="*{idCliente}">

                    <div class="form-grid">
                        <div>
                            <label for="nombre">Nombre</label>
                            <input id="nombre" th:field="*{nombre}" required>
                        </div>

                        <div>
                            <label for="telefono">Telefono</label>
                            <input id="telefono" th:field="*{telefono}" required
                                   inputmode="numeric" maxlength="10" pattern="[0-9]{1,10}">
                            <span id="telefono-error" hidden
                                  style="color:#dc3545;font-size:0.8rem;margin-top:0.25rem;display:block;">
                                El teléfono debe contener únicamente números y no puede superar los 10 dígitos.
                            </span>
                        </div>
                    </div>

                    <div>
                        <label for="direccion">Direccion</label>
                        <input id="direccion" th:field="*{direccion}" required>
                    </div>

                    <div>
                        <label for="barrioId">Barrio</label>
                        <select id="barrioId" name="barrioId" required>
                            <option value="" disabled th:selected="${cliente.barrio == null}">Seleccione un barrio</option>
                            <option th:each="b : ${barrios}"
                                    th:value="${b.idBarrio}"
                                    th:selected="${cliente.barrio != null and cliente.barrio.idBarrio == b.idBarrio}"
                                    th:text="${b.nombre + (b.cobertura ? ' (Cobertura)' : ' (Sin cobertura)')}"></option>
                        </select>
                    </div>

                    <div class="actions mt-4">
                        <button class="btn-primary" type="submit">Guardar</button>
                        <a class="btn btn-link" th:href="@{/clientes}">Cancelar</a>
                    </div>
                </form>
            </section>
        </section>
    </main>
</div>
<script>
(function () {
    const tel = document.getElementById('telefono');
    const err = document.getElementById('telefono-error');
    tel.addEventListener('input', () => {
        tel.value = tel.value.replace(/[^0-9]/g, '').slice(0, 10);
        err.hidden = tel.value === '' || /^[0-9]{1,10}$/.test(tel.value);
    });
    tel.addEventListener('invalid', (e) => { e.preventDefault(); err.hidden = false; });
})();
</script>
</body>
</html>
