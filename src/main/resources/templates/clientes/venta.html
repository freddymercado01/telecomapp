<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venta de servicio | TelecomApp</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="layout">
    <aside th:replace="~{fragments/sidebar :: appSidebar('clientes')}"></aside>

    <main class="content">
        <section class="page stack-lg">
            <header class="page-header">
                <div class="brand">
                    <h1>Venta de servicio de Internet</h1>
                    <p>Registra el cliente, valida su barrio y genera el contrato y la factura automáticamente.</p>
                </div>
                <a class="btn btn-link" th:href="@{/clientes}">Volver</a>
            </header>

            <section class="card card-sm">
                <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
                <form th:action="@{/clientes/vender}" method="post" th:object="${cliente}" class="form-stack">
                    <div class="form-grid">
                        <div>
                            <label for="nombre">Nombre</label>
                            <input id="nombre" th:field="*{nombre}" required>
                        </div>
                        <div>
                            <label for="telefono">Telefono</label>
                            <input id="telefono" th:field="*{telefono}" required>
                        </div>
                    </div>

                    <div>
                        <label for="direccion">Direccion</label>
                        <input id="direccion" th:field="*{direccion}" required>
                    </div>

                    <div class="form-grid">
                        <div>
                            <label for="barrioId">Barrio</label>
                            <select id="barrioId" name="barrioId" required>
                                <option value="" disabled selected>Seleccione un barrio</option>
                                <option th:each="b : ${barrios}"
                                        th:value="${b.idBarrio}"
                                        th:text="${b.nombre}"></option>
                            </select>
                        </div>
                        <div>
                            <label for="planId">Plan</label>
                            <select id="planId" name="planId" required>
                                <option value="" disabled selected>Seleccione un plan</option>
                                <option th:each="plan : ${planes}"
                                        th:value="${plan.idPlan}"
                                        th:text="${plan.nombre + ' - ' + plan.tipoServicio.etiqueta + ' - $' + plan.precioMensual}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="actions mt-4">
                        <button id="submitSale" class="btn-primary" type="submit" disabled>Vender servicio</button>
                        <a class="btn btn-link" th:href="@{/clientes}">Cancelar</a>
                    </div>
                </form>
            </section>
        </section>
    </main>
</div>

<div id="coverageModal" class="modal-backdrop" hidden>
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="coverageTitle">
        <h2 id="coverageTitle">Validacion de cobertura</h2>
        <p id="coverageMessage"></p>
        <div class="actions">
            <button id="coverageClose" type="button" class="btn-primary">Aceptar</button>
        </div>
    </section>
</div>

<script>
    const barrioSelect = document.getElementById('barrioId');
    const submitSale = document.getElementById('submitSale');
    const modal = document.getElementById('coverageModal');
    const modalCard = modal.querySelector('.modal-card');
    const modalTitle = document.getElementById('coverageTitle');
    const modalMessage = document.getElementById('coverageMessage');
    const modalClose = document.getElementById('coverageClose');

    function showCoverageModal(hasCoverage, message) {
        modalTitle.textContent = hasCoverage ? 'Con cobertura' : 'Sin cobertura';
        modalMessage.textContent = message;
        modalCard.classList.toggle('modal-success', hasCoverage);
        modalCard.classList.toggle('modal-error', !hasCoverage);
        modal.hidden = false;
        modalClose.focus();
    }

    barrioSelect.addEventListener('change', async () => {
        submitSale.disabled = true;
        const barrioId = barrioSelect.value;
        if (!barrioId) {
            return;
        }

        try {
            const response = await fetch(`/api/barrios/${barrioId}/cobertura`);
            if (!response.ok) {
                showCoverageModal(false, 'No se pudo validar la cobertura del barrio seleccionado.');
                return;
            }

            const data = await response.json();
            submitSale.disabled = !data.cobertura;
            const detail = data.descripcion ? ` ${data.descripcion}` : '';
            showCoverageModal(
                data.cobertura,
                data.cobertura
                    ? `${data.nombre} tiene cobertura disponible.${detail}`
                    : `${data.nombre} no tiene cobertura disponible. No se puede continuar con la venta.${detail}`
            );
        } catch (error) {
            showCoverageModal(false, 'No se pudo consultar el servicio de cobertura.');
        }
    });

    modalClose.addEventListener('click', () => {
        modal.hidden = true;
    });
</script>
</body>
</html>
