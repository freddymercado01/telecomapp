# Configuracion local por defecto con H2 en memoria.
spring.datasource.url=jdbc:h2:mem:telecomapp;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf
spring.thymeleaf.cache=false

# Server
server.port=${PORT:8081}
server.forward-headers-strategy=framework

# Swagger/OpenAPI
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs
springdoc.show-actuator=false

# JWT
jwt.secret=${JWT_SECRET:a8F#kL29sP@zX!qT7mN4vR$yB1cD6E9hW}
jwt.expiration=900000

# OpenAPI server URL (sobreescribir por perfil)
app.server-url=http://localhost:8081
